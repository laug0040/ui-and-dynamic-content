<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korey UI & Dynamic</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <section>
        <header class="masthead">
            <img src="">

        <main>

        <footer>
            <div class="footer-links">
                <a href="#" class="Facebook"><img src="img/instagram-circle.svg" alt="Instagram"></a>
                <a href="#" class="Instagram"><img src="img/facebook.svg" alt="Facebook"></a>
                <a href="#" class="Twitter"><img src="img/twitter-alt-circle.svg" alt="Twitter"></a>

        </footer>

</html>
